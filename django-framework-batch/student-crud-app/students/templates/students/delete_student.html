{% extends 'students/base.html' %}

{% block content %}
    <h2>Delete Student</h2>
    <p>Are you sure you want to delete the student "{{ student.name }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
        <a href="{% url 'list_students' %}">Cancel</a>
    </form>
{% endblock %}
